<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ابراهیم نعیما</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#0a0714;--ink:#f2efff;--muted:#a79fc9;--panel:#151027;--line:#2c2350;--neon:#39ff88;--violet:#9d4dff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;
background:
radial-gradient(500px 320px at 85% -5%,rgba(157,77,255,.35),transparent 70%),
radial-gradient(420px 300px at 5% 105%,rgba(57,255,136,.22),transparent 70%),
linear-gradient(rgba(157,77,255,.08) 1px,transparent 1px) 0 0/36px 36px,
linear-gradient(90deg,rgba(157,77,255,.08) 1px,transparent 1px) 0 0/36px 36px,
var(--bg)}
main{width:100%;max-width:420px;padding:52px 20px 40px}
.avatar{width:104px;height:104px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:800;color:var(--neon);
background:var(--panel);border:3px solid var(--neon);box-shadow:0 0 18px var(--neon),0 0 50px rgba(57,255,136,.35),inset 0 0 18px rgba(57,255,136,.25);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 26px var(--neon),0 0 70px rgba(57,255,136,.5),inset 0 0 22px rgba(57,255,136,.35)}}
@media (prefers-reduced-motion:reduce){.avatar{animation:none}}
h1{margin:0 0 6px;text-align:center;font-size:2.1rem;font-weight:800;line-height:1.3;text-shadow:0 0 14px rgba(157,77,255,.9)}
.sub{margin:0 0 34px;text-align:center;color:var(--muted)}
a.row{display:flex;align-items:center;gap:14px;min-height:72px;margin-bottom:14px;padding:14px 16px;border-radius:14px;color:inherit;text-decoration:none;
background:var(--panel);border:1px solid var(--line);transition:border-color .15s,box-shadow .15s,transform .1s}
a.row:hover,a.row:focus-visible{border-color:var(--neon);box-shadow:0 0 16px rgba(57,255,136,.45);outline:none}
a.row:active{transform:scale(.98)}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.ic svg{width:24px;height:24px;fill:#fff}
.tg{background:#2aabee;box-shadow:0 0 14px rgba(42,171,238,.6)}
.ig{background:linear-gradient(45deg,#feda75,#fa7e1e 25%,#d62976 55%,#962fbf 80%,#4f5bd5);box-shadow:0 0 14px rgba(214,41,118,.55)}
.ph{background:var(--neon);box-shadow:0 0 14px rgba(57,255,136,.6)}
.ph svg{fill:#0a0714}
.t{display:flex;flex-direction:column;min-width:0}
.t small{color:var(--muted);font-size:.8rem}
.t b{font-weight:600;font-size:1.08rem;direction:ltr;text-align:right;unicode-bidi:plaintext}
</style>
</head>
<body>
<main>
  <div class="avatar" aria-hidden="true">ا</div>
  <h1>ابراهیم نعیما</h1>
  <p class="sub">راه‌های ارتباط با من</p>

  <a class="row" href="https://t.me/Ebrahim_na1">

    <span class="t"><small>تلگرام</small><b>@Ebrahim_na1</b></span>
  </a>

    <span class="ic ig"><svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.3-3.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg></span>

</body>
</html>
